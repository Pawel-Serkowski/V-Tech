services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: selenet-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws/status
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: selenet-backend
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_NAME: packets.priority
      RABBITMQ_MAX_PRIORITY: 10
      STATUS_EXCHANGE_NAME: status.updates
      RETRY_SCAN_INTERVAL_SECONDS: 3
      RETRY_BATCH_SIZE: 200
    ports:
      - "8000:8000"
    restart: on-failure
    depends_on:
      - rabbitmq
      - mongo

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: selenet-worker
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_NAME: packets.priority
      RABBITMQ_MAX_PRIORITY: 10
      BACKEND_STATUS_URL: http://backend:8000/api/packets/status
    restart: on-failure
    depends_on:
      - backend
      - rabbitmq
      - mongo

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: selenet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongo:
    image: mongo:7
    container_name: selenet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  rabbitmq_data:
  mongo_data: