name: selenet

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    container_name: selenet-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8001
      VITE_WS_URL: ws://localhost:8001/ws/status
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: selenet-backend
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_NAME: packets.priority
      PACKET_QUEUE_PREFIX: packets
      RABBITMQ_MAX_PRIORITY: 10
      STATUS_EXCHANGE_NAME: status.updates
      RETRY_SCAN_INTERVAL_SECONDS: 3
      RETRY_BATCH_SIZE: 200
    ports:
      - "8001:8000"
    restart: on-failure
    depends_on:
      - rabbitmq
      - mongo

  worker_earth_gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: selenet-worker-earth-gateway
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_PREFIX: packets
      NODE_ID: EARTH_GATEWAY
      NODE_LOCATION: Earth Mission Control
      RABBITMQ_MAX_PRIORITY: 10
      BACKEND_STATUS_URL: http://backend:8000/api/packets/status
      BACKEND_PACKETS_URL: http://backend:8000/api/packets
    restart: on-failure
    depends_on:
      - backend
      - rabbitmq
      - mongo

  worker_sat_1:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: selenet-worker-sat-1
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_PREFIX: packets
      NODE_ID: SAT_1
      NODE_LOCATION: NRHO Plane A
      RABBITMQ_MAX_PRIORITY: 10
      BACKEND_STATUS_URL: http://backend:8000/api/packets/status
      BACKEND_PACKETS_URL: http://backend:8000/api/packets
    restart: on-failure
    depends_on:
      - backend
      - rabbitmq
      - mongo

  worker_sat_2:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: selenet-worker-sat-2
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_PREFIX: packets
      NODE_ID: SAT_2
      NODE_LOCATION: Lunar Far Side Relay
      RABBITMQ_MAX_PRIORITY: 10
      BACKEND_STATUS_URL: http://backend:8000/api/packets/status
      BACKEND_PACKETS_URL: http://backend:8000/api/packets
    restart: on-failure
    depends_on:
      - backend
      - rabbitmq
      - mongo

  worker_lunar_gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: selenet-worker-lunar-gateway
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: selenet
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      PACKET_QUEUE_PREFIX: packets
      NODE_ID: LUNAR_GATEWAY
      NODE_LOCATION: Lunar Gateway Hub
      RABBITMQ_MAX_PRIORITY: 10
      BACKEND_STATUS_URL: http://backend:8000/api/packets/status
      BACKEND_PACKETS_URL: http://backend:8000/api/packets
    restart: on-failure
    depends_on:
      - backend
      - rabbitmq
      - mongo

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: selenet-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mongo:
    image: mongo:7
    container_name: selenet-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  rabbitmq_data:
  mongo_data: